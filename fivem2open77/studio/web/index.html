<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fivem2open77 Studio</title>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/universe.css">
<link rel="stylesheet" href="/css/hud.css">
<link rel="stylesheet" href="/css/city3d.css">
<link rel="stylesheet" href="/css/term.css">
<link rel="icon" href="/img/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <a class="brand" href="#/home" title="fivem2open77 Studio">
      <img src="/img/emblem.png" alt="" width="40" height="36">
    </a>
    <div class="product"><b>fivem2open77</b><span>Studio</span></div>
    <nav id="crumbs" aria-label="Where you are"></nav>
    <div class="spacer"></div>
    <button id="cmdk" type="button" title="Search and commands (Ctrl+K)">
      <svg class="icon sm"><use href="#i-search"/></svg><span class="grow">Go to, or run a command</span><kbd>Ctrl K</kbd>
    </button>
    <a id="tb-jobs" href="#/jobs" title="Activity"><svg class="icon sm"><use href="#i-activity"/></svg><span>Idle</span></a>
  </header>
  <nav id="rail" aria-label="Sections">
    <a href="#/home" data-nav="home"><svg class="icon"><use href="#i-world"/></svg><span>Home</span></a>
    <a href="#/projects" data-nav="projects"><svg class="icon"><use href="#i-car"/></svg><span>Cars</span></a>
    <a href="#/maps" data-nav="maps"><svg class="icon"><use href="#i-map"/></svg><span>Maps</span></a>
    <a href="#/world" data-nav="world"><svg class="icon"><use href="#i-world"/></svg><span>World</span></a>
    <a href="#/live" data-nav="live"><svg class="icon"><use href="#i-live"/></svg><span>Live</span></a>
    <a href="#/servers" data-nav="servers"><svg class="icon"><use href="#i-server"/></svg><span>Servers</span></a>
    <a href="#/quality" data-nav="quality"><svg class="icon"><use href="#i-check"/></svg><span>Quality</span><span id="qc-badge" class="badge warn hidden"></span></a>
    <div class="sep"></div>
    <a href="#/agent" data-nav="agent"><svg class="icon"><use href="#i-agent"/></svg><span>Agent</span></a>
    <a href="#/terminal" data-nav="terminal"><svg class="icon"><use href="#i-terminal"/></svg><span>Terminal</span></a>
    <a href="#/jobs" data-nav="jobs"><svg class="icon"><use href="#i-activity"/></svg><span>Activity</span><span id="jobs-badge" class="badge hidden"></span></a>
    <div class="spacer"></div>
    <a href="#/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span><span id="setup-badge" class="badge warn hidden">!</span></a>
  </nav>
  <main id="main"></main>
  <footer id="statusbar">
    <div id="conn" class="conn item">connecting</div>
    <a id="sb-agents" class="item hidden" href="#/settings/agents" title="An agent is working (MCP)"></a>
    <a id="sb-term" class="item" title="Terminal (Ctrl+`)"><svg class="icon sm"><use href="#i-terminal"/></svg><span>Terminal</span></a>
    <div id="sb-job" class="item grow"></div>
    <a id="sb-tools" class="item" href="#/settings"></a>
    <div id="sb-version" class="item"></div>
  </footer>
</div>
<div id="term-dock" aria-label="Terminal"></div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
